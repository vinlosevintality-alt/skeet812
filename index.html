<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOODMOTHER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@property --rgb-angle{
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
@keyframes rgbSpin{ to{ --rgb-angle: 360deg; } }

*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; }
body{
  background:#000;
  color:#fff;
  font-family:Inter, Arial, sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- ФОН (размытая картинка) ---------- */
.bg-img{
  position:fixed; inset:-6%;
  background:url("https://i.pinimg.com/736x/b6/17/00/b6170072e85979a4b71412cb7528845d.jpg") center/cover no-repeat;
  filter:blur(34px) brightness(.38) saturate(.55) contrast(1.15);
  transform:scale(1.18);
  z-index:-3;
}
.bg-veil{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,.35), rgba(0,0,0,.85) 70%),
    linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.8));
}
.bg-noise{
  position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ---------- RGB ПО КРАЯМ ---------- */
.rgb-glow, .rgb-edge{
  position:fixed; inset:0; pointer-events:none;
  padding:3px;
  background:conic-gradient(from var(--rgb-angle),
    #ff2d2d, #ff8a00, #ffe600, #35ff6a, #00e0ff, #3b6bff, #b23bff, #ff2d2d);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite:exclude;
  animation:rgbSpin 8s linear infinite;
}
.rgb-glow{
  padding:2px;
  filter:blur(26px) saturate(1.8);
  opacity:.85;
  z-index:58;
}
.rgb-edge{
  z-index:60;
  filter:saturate(1.35);
  opacity:.95;
}
.rgb-inner{
  position:fixed; inset:0; z-index:59; pointer-events:none;
  box-shadow:inset 0 0 90px rgba(0,0,0,.9), inset 0 0 30px rgba(0,0,0,.9);
}

/* ---------- СТРАНИЦА ---------- */
.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 18px;
  perspective:1400px;
}
.wrap{ width:min(940px,100%); position:relative; }

/* мягкие блики за карточкой */
.aura{
  position:absolute; border-radius:50%; filter:blur(120px); opacity:.16; pointer-events:none;
}
.aura.one{ width:420px; height:420px; background:#ffffff; top:-160px; left:-140px; animation:floatA 9s ease-in-out infinite alternate; }
.aura.two{ width:380px; height:380px; background:#8a8a8a; bottom:-180px; right:-120px; animation:floatA 11s ease-in-out infinite alternate-reverse; }
@keyframes floatA{
  from{ transform:translate3d(-16px,-10px,0) scale(1); }
  to{ transform:translate3d(26px,22px,0) scale(1.18); }
}

/* ---------- ЖИДКОЕ СТЕКЛО ---------- */
.card{
  position:relative;
  padding:44px 46px 34px;
  border-radius:34px;
  background:linear-gradient(150deg, rgba(255,255,255,.085), rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:
    0 50px 120px rgba(0,0,0,.85),
    inset 0 1px 1px rgba(255,255,255,.18),
    inset 0 -1px 1px rgba(255,255,255,.05);
  backdrop-filter:blur(30px) saturate(130%);
  -webkit-backdrop-filter:blur(30px) saturate(130%);
  overflow:hidden;
  transform-style:preserve-3d;
  animation:cardFloat 7s ease-in-out infinite;
}
.card::before{
  content:"";
  position:absolute; inset:0;
  border-radius:34px;
  pointer-events:none;
  background:linear-gradient(120deg, rgba(255,255,255,.12), transparent 38%, transparent 68%, rgba(255,255,255,.05));
}
.card::after{
  content:"";
  position:absolute; top:-60%; left:-30%;
  width:60%; height:220%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
  transform:rotate(18deg);
  animation:sheen 9s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sheen{
  0%,100%{ transform:translateX(-40%) rotate(18deg); opacity:0; }
  45%{ opacity:1; }
  70%{ transform:translateX(280%) rotate(18deg); opacity:0; }
}
@keyframes cardFloat{
  0%,100%{ transform:translateY(0) rotateX(0deg) rotateY(0deg); }
  50%{ transform:translateY(-9px) rotateX(.6deg) rotateY(-.6deg); }
}

/* ---------- ШАПКА ---------- */
.top{
  display:flex; align-items:center; gap:16px;
  position:relative; z-index:2;
}
.logo{
  width:64px; height:64px; flex:0 0 auto;
  border-radius:20px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700; font-size:23px; letter-spacing:-1px;
  color:#fff;
  background:linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 16px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
}
.title{
  margin:0;
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(30px, 5.2vw, 54px);
  line-height:1;
  font-weight:700;
  letter-spacing:-2px;
  background:linear-gradient(180deg,#fff 0%,#c9c9c9 45%,#5e5e5e 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 60px rgba(255,255,255,.10);
}

/* ---------- 3D СЦЕНА ---------- */
.stage{
  position:relative;
  height:360px;
  border-radius:24px;
  overflow:hidden;
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.05), rgba(0,0,0,.55) 70%);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 0 70px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08);
  cursor:grab;
  z-index:2;
}
.stage:active{ cursor:grabbing; }
.stage canvas{ display:block; width:100%; height:100%; }
.loader{
  position:absolute; inset:0;
  display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,.55); backdrop-filter:blur(6px);
  color:rgba(255,255,255,.5); font-size:12.5px; letter-spacing:.5px;
}
.loader.show{ display:flex; }

/* ---------- КНОПКИ ---------- */
.buttons{
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  position:relative; z-index:2;
}
.btn{
  position:relative;
  min-height:68px;
  padding:0 20px;
  display:flex; align-items:center; justify-content:space-between;
  text-decoration:none;
  color:#fff;
  border-radius:18px;
  background:linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, background .35s, box-shadow .35s;
}
.btn::before{
  content:"";
  position:absolute; width:150px; height:150px; top:-110px; left:-110px;
  background:rgba(255,255,255,.16);
  filter:blur(34px);
  transition:.55s;
}
.btn:hover{
  transform:translateY(-6px);
  background:linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
  border-color:rgba(255,255,255,.3);
  box-shadow:0 22px 45px rgba(0,0,0,.55), 0 0 30px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.22);
}
.btn:hover::before{ left:110%; top:100%; }
.btn-main{ display:flex; align-items:center; gap:14px; }
.ico{
  width:38px; height:38px; flex:0 0 auto;
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; letter-spacing:.3px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.9);
}
.name{ font-size:14.5px; font-weight:700; letter-spacing:.2px; }
.arrow{ color:rgba(255,255,255,.3); font-size:18px; transition:.3s; }
.btn:hover .arrow{ color:#fff; transform:translateX(5px); }

/* ---------- ФУТЕР ---------- */
.foot{
  margin-top:24px;
  display:flex; justify-content:center; align-items:center;
  font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase;
  color:rgba(255,255,255,.22);
  position:relative; z-index:2;
}
.dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:#fff; margin-right:8px; vertical-align:middle;
  box-shadow:0 0 10px rgba(255,255,255,.8);
  animation:pulse 2s infinite;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.3} }

/* ---------- АДАПТИВ ---------- */
@media (max-width:700px){
  .card{ padding:30px 20px 24px; border-radius:26px; }
  .stage{ height:280px; border-radius:20px; }
  .buttons{ grid-template-columns:1fr; }
  .logo{ width:54px; height:54px; border-radius:17px; font-size:20px; }
  .title{ letter-spacing:-1.2px; }
}
@media (prefers-reduced-motion:reduce){
  .card, .aura, .card::after, .rgb-edge, .rgb-glow{ animation:none !important; }
}
</style>
</head>
<body>

<div class="bg-img"></div>
<div class="bg-veil"></div>
<div class="bg-noise"></div>

<div class="rgb-glow"></div>
<div class="rgb-edge"></div>
<div class="rgb-inner"></div>

<div class="page">
  <div class="wrap">
    <div class="aura one"></div>
    <div class="aura two"></div>

    <div class="card">
      <div class="top">
        <div class="logo">BM</div>
        <div class="brand-txt">
          <h1 class="title">BLOODMOTHER</h1>
        </div>
      </div>

      <div class="stage" id="stage">
        <canvas id="planetCanvas"></canvas>
        <div class="loader" id="loader">Загрузка</div>
      </div>

      <div class="buttons">
        <a class="btn" href="https://t.me/nixware8012" target="_blank" rel="noopener noreferrer">
          <div class="btn-main"><div class="ico">TG</div><div class="name">TGC</div></div>
          <div class="arrow">→</div>
        </a>
        <a class="btn" href="https://t.me/Wiskas_em" target="_blank" rel="noopener noreferrer">
          <div class="btn-main"><div class="ico">✈</div><div class="name">Telegram</div></div>
          <div class="arrow">→</div>
        </a>
        <a class="btn" href="https://www.tiktok.com/@kuzershtern" target="_blank" rel="noopener noreferrer">
          <div class="btn-main"><div class="ico">TT</div><div class="name">TikTok</div></div>
          <div class="arrow">→</div>
        </a>
        <a class="btn" href="https://funpay.com/lots/offer?id=37928168" target="_blank" rel="noopener noreferrer">
          <div class="btn-main"><div class="ico">FP</div><div class="name">FunPay</div></div>
          <div class="arrow">→</div>
        </a>
        <a class="btn" href="https://t.me/sket82_bot" target="_blank" rel="noopener noreferrer">
          <div class="btn-main"><div class="ico">BOT</div><div class="name">БОТ</div></div>
          <div class="arrow">→</div>
        </a>
      </div>

      <div class="foot">
        <span><span class="dot"></span>© 2026 bloodmother</span>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ============ загрузка three.js ============ */
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.body.appendChild(s);
  });
}

let renderer, scene, camera, controls, clock, rafId;
let planet, ring1, ring2, wire, stars, group;

function initThree(){
  const canvas = document.getElementById('planetCanvas');
  const stage  = document.getElementById('stage');

  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight, false);

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
  camera.position.set(0, 1.1, 6.4);

  clock = new THREE.Clock();
  group = new THREE.Group();
  scene.add(group);

  /* ---- ЧЁРНАЯ ПЛАНЕТА ---- */
  const planetGeo = new THREE.SphereGeometry(1.62, 64, 64);
  const planetMat = new THREE.MeshStandardMaterial({
    color: 0x0a0a0c,
    roughness: 0.42,
    metalness: 0.92,
    emissive: 0x050506,
    emissiveIntensity: 1
  });
  planet = new THREE.Mesh(planetGeo, planetMat);
  group.add(planet);

  /* сетка-каркас */
  wire = new THREE.Mesh(
    new THREE.SphereGeometry(1.628, 28, 18),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      wireframe: true,
      transparent: true,
      opacity: 0.10
    })
  );
  group.add(wire);

  /* тонкая белая оболочка */
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(1.72, 48, 48),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.05,
      side: THREE.BackSide
    })
  );
  group.add(halo);

  /* ---- КОЛЬЦА ---- */
  ring1 = new THREE.Mesh(
    new THREE.RingGeometry(2.15, 3.05, 128),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.16
    })
  );
  ring1.rotation.x = Math.PI / 2.35;
  group.add(ring1);

  ring2 = new THREE.Mesh(
    new THREE.RingGeometry(3.18, 3.28, 128),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.30
    })
  );
  ring2.rotation.x = Math.PI / 2.35;
  group.add(ring2);

  /* ---- СВЕТ (только белый / серый) ---- */
  scene.add(new THREE.AmbientLight(0x8a8a8a, 0.55));

  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(5, 3.5, 5);
  scene.add(key);

  const rim = new THREE.PointLight(0xffffff, 1.4, 30);
  rim.position.set(-5, -2, -4);
  scene.add(rim);

  const top = new THREE.PointLight(0xffffff, 0.8, 30);
  top.position.set(0, 6, 1);
  scene.add(top);

  /* ---- ЗВЁЗДЫ ---- */
  const starCount = 900;
  const pos = new Float32Array(starCount * 3);
  for(let i = 0; i < starCount * 3; i++){
    pos[i] = (Math.random() - 0.5) * 46;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.045,
    transparent: true,
    opacity: 0.75
  }));
  scene.add(stars);

  /* ---- УПРАВЛЕНИЕ ---- */
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;
  controls.minDistance = 3.6;
  controls.maxDistance = 12;
  controls.rotateSpeed = 0.85;
  controls.zoomSpeed = 0.7;

  resizeThree();
  window.addEventListener('resize', resizeThree);
  animateThree();
}

function resizeThree(){
  if(!renderer) return;
  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  if(!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function animateThree(){
  rafId = requestAnimationFrame(animateThree);
  const dt = clock.getDelta();

  planet.rotation.y += dt * 0.14;
  wire.rotation.y   -= dt * 0.06;
  ring1.rotation.z  += dt * 0.05;
  ring2.rotation.z  -= dt * 0.035;
  stars.rotation.y  += dt * 0.012;

  controls.update();
  renderer.render(scene, camera);
}

/* ---- запуск ---- */
(function boot(){
  const loader = document.getElementById('loader');
  loader.classList.add('show');

  loadScript('https://unpkg.com/three@0.128.0/build/three.min.js')
    .then(()=> loadScript('https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'))
    .then(()=>{
      loader.classList.remove('show');
      initThree();
    })
    .catch(()=>{
      loader.innerHTML = '<span>Не удалось загрузить 3D-движок. Проверьте интернет и обновите страницу.</span>';
    });
})();
</script>
</body>
</html>
